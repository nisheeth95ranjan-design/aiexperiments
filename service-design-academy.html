  tabs.innerHTML=TABS.map(([k,l])=>`<button class="tab" data-v="${k}" ${view===k?'aria-current="page"':''}>${I[k]}<span>${l}</span>${k==='review'&&S.missed.length?`<span class="badge">${S.missed.length}</span>`:''}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
const TITLES={learn:['Service Design Academy','Expert curriculum'],review:['Review','Questions to revisit'],glossary:['Glossary',GLOSS.length+' terms'],library:['Library','Books and papers'],me:['Progress','Your record'],result:['Service Design Academy','Session summary']};
function renderTop(){
  if(sess){
    const n=sess.steps.length;
    top.innerHTML=`<div class="top-in"><button class="iconbtn" id="exit" aria-label="Exit">${I.x}</button><div class="top-title">${sess.title}<small>${sess.code} · Step ${sess.k+1} of ${n}</small></div><div class="xp" id="xp">${S.xp} XP</div><button class="iconbtn" id="themebtn" aria-label="Toggle theme"></button></div>
    <div class="strip">${sess.steps.map((_,j)=>`<i class="${j<sess.k?'on':j===sess.k?'now':''}"></i>`).join('')}</div>`;
    $('#exit').onclick=()=>go(sess.kind==='module'?'learn':sess.kind==='review'?'review':'learn');
  } else {
    const [t,s]=TITLES[view];
    top.innerHTML=`<div class="top-in"><div class="mark" aria-hidden="true">SD</div><div class="top-title">${t}<small>${s}</small></div><div class="xp" id="xp">${S.xp} XP</div><button class="iconbtn" id="themebtn" aria-label="Toggle theme"></button></div>`;
  }
  $('#themebtn').onclick=toggleTheme; applyTheme();
}
function pop(t){document.querySelectorAll('.pop').forEach(x=>x.remove());const e=document.createElement('div');e.className='pop';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}

function go(v){view=v;sess=null;document.body.classList.remove('in-session');render()}
function render(){renderTop();renderTabs();({learn:vLearn,review:vReview,glossary:vGloss,library:vLib,me:vMe})[view]();window.scrollTo(0,0)}

/* ── LEARN ── */
function vLearn(){
  const doneN=Object.keys(S.done).length;
  const nextI=Math.max(0,MODS.findIndex((m,i)=>!S.done[m.code]));
  const allDone=doneN===MODS.length;
  const fill=MODS.length>1?Math.min(100,(doneN?(Math.max(...MODS.map((m,i)=>S.done[m.code]?i:-1)))/(MODS.length-1)*100:0)):0;
  const cur=S.cur&&MODS[S.cur.mi]&&S.cur.k>0?S.cur:null;
  let h=(canSave?'':`<div class="warn" role="alert"><b>Progress can't be saved here.</b> This viewer blocks storage, so your progress will be lost when you close it. Open the file in Chrome or Safari instead, or copy a backup code from the Progress tab.</div>`)+`<section class="hero fade">
    <span class="mono" style="color:var(--accent)">12 modules · ${allQ().length} challenges · ${GLOSS.length} terms</span>
    <h1>Service Design <span>Academy</span></h1>
    <p class="lede">From service-dominant logic to blueprints, queueing, measurement, organisational design and critical case analysis. Written for practitioners who want the theory behind the tools.</p>
  </section>
  <section class="journey">
    <div class="journey-head"><b>${allDone?'Curriculum complete':doneN?'Your journey':'Start your journey'}</b><span class="mono" style="color:var(--muted)">${doneN} of ${MODS.length} touchpoints</span></div>
    <div class="tps" style="--fill:${fill}%">${MODS.map((m,i)=>`<div class="tp ${S.done[m.code]?'on':''} ${!allDone&&i===nextI?'next':''}" title="${m.code}"><i></i></div>`).join('')}</div>
    <div class="vis mono">line of visibility</div>
    ${cur?`<button class="resume" id="resume"><span class="mono">Resume where you left off</span><b>${MODS[cur.mi].code} ${MODS[cur.mi].name}</b><span class="hint">Step ${cur.k+1} of ${MODS[cur.mi].steps.length} · saved ${fmtTime(cur.at)}</span></button>`:''}
    <div class="row-actions">
      <button class="btn primary" id="cont" style="flex:1 1 200px">${allDone?'Revisit M01':doneN?'Continue':'Begin'} · ${MODS[nextI].code} ${MODS[nextI].name}</button>
      <button class="btn" id="exam" style="flex:1 1 140px">Mastery exam</button>
    </div>
  </section>`;
  TRACKS.forEach(([t,ids])=>{
    h+=`<section class="track"><div class="track-h mono">${t}</div><div class="mlist">${ids.map(mi=>{
      const m=MODS[mi], d=S.done[m.code], p=mastery(mi), qs=qIds(mi).length;
      return `<button class="mrow ${d?'done':''}" data-m="${mi}"><span class="mcode">${m.code}</span><span style="min-width:0"><span class="mname">${m.name}</span><span class="mmeta"><span class="lvl ${m.level}">${m.level}</span><span>${m.steps.length} steps · ${qs} challenges</span></span></span><span class="pct">${d||p?p+'%':'›'}</span></button>`;
    }).join('')}</div></section>`;
  });
  main.innerHTML=h;
  $('#cont').onclick=()=>startModule(nextI);
  if(cur) $('#resume').onclick=()=>startModule(cur.mi,cur);

  main.querySelectorAll('.mrow').forEach(b=>b.onclick=()=>startModule(+b.dataset.m));

/* ── SESSIONS ── */
function begin(o){sess=Object.assign({k:0,ok:0,n:0,gained:0},o);markDay();save();view='session';document.body.classList.add('in-session');renderStep()}
function startModule(mi,from){const m=MODS[mi];const o={kind:'module',mi,title:m.name,code:m.code,steps:m.steps.map((s,i)=>({mi,i,s}))};
  if(!from&&S.cur&&S.cur.mi===mi&&S.cur.k>0&&S.cur.k<m.steps.length) from=S.cur;
  if(from){o.k=Math.min(from.k,m.steps.length-1);o.ok=from.ok||0;o.n=from.n||0;o.gained=from.gained||0}
  begin(o)}
function startReview(){const steps=S.missed.map(id=>{const [mi,i]=id.split('.').map(Number);return MODS[mi]&&MODS[mi].steps[i]?{mi,i,s:MODS[mi].steps[i]}:null}).filter(Boolean);if(!steps.length)return;begin({kind:'review',title:'Review queue',code:'Review',steps:shuffle(steps)})}
function startExam(){begin({kind:'exam',title:'Mastery exam',code:'Exam',steps:shuffle(allQ()).slice(0,20)})}

function renderStep(){
  renderTop(); window.scrollTo(0,0);
  const st=sess.steps[sess.k], s=st.s, m=MODS[st.mi];
  const tag=`${m.code} · ${pad(st.i+1)}`;
  const kinds={c:['Concept',''],q:['Question','q'],m:['Match','q'],s:['Sort','q'],o:['Sequence','q']};
  const [kl,kc]=kinds[s.t];
  const eb=`<div class="eyebrow mono"><span class="kind ${kc}">${kl}</span><span>${tag}</span>${sess.kind!=='module'?`<span>${m.name}</span>`:''}</div>`;
  const card=document.createElement('article'); card.className='card fade';
  main.innerHTML=''; main.appendChild(card);
  ({c:rConcept,q:rMCQ,m:rMatch,s:rSort,o:rOrder})[s.t](card,s,eb,st);
}
function nextStep(){if(!sess)return;sess.k++; if(sess.k>=sess.steps.length) finish(); else {if(sess.kind==='module'){S.cur={mi:sess.mi,k:sess.k,ok:sess.ok,n:sess.n,gained:sess.gained,at:Date.now()};save()} renderStep()}}

function record(st,ok){
  const id=st.mi+'.'+st.i, val=XPV[st.s.t]||10;
  S.res[id]=ok; sess.n++;
  if(ok){sess.ok++; if(!S.earned[id]){S.earned[id]=1;S.xp+=val;sess.gained+=val;pop('+'+val+' XP')} S.missed=S.missed.filter(x=>x!==id)}
  else if(!S.missed.includes(id)) S.missed.push(id);
  save(); const x=$('#xp'); if(x) x.textContent=S.xp+' XP';
}
function feedback(card,ok,title,text){
  const slot=card.querySelector('.fb-slot');
  slot.innerHTML=`<div class="fb ${ok?'ok':'no'}" role="status"><strong>${title}</strong><span>${text||''}</span></div><button class="btn primary block" id="nx">${sess.k===sess.steps.length-1?'Finish':'Continue'}</button>`;
  $('#nx').onclick=nextStep;
  slot.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* concept */
function rConcept(card,s,eb){
  let h=eb+`<h2>${s.h}</h2>`;
  if(s.body) h+=`<div class="prose">${s.body}</div>`;
  if(s.fig) h+=`<figure class="lanes"><figcaption class="mono">${s.fig.t}</figcaption>${s.fig.rows.map(r=>r[0]==='-'?`<div class="lane-line mono">${r[1]}</div>`:`<div class="lane"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</figure>`;
  if(s.pts) h+=`<dl class="pts">${s.pts.map(p=>`<div><dt>${p[0]}</dt><dd>${p[1]}</dd></div>`).join('')}</dl>`;
  if(s.note) h+=`<aside class="note expert"><span class="mono">Expert lens</span><div>${s.note}</div></aside>`;
  if(s.ex) h+=`<aside class="note field"><span class="mono">In practice</span><div>${s.ex}</div></aside>`;
  if(s.refs) h+=`<div class="refs"><span class="mono">Sources</span>${s.refs.map(r=>`<span>${r}</span>`).join('')}</div>`;
  h+=`<button class="btn primary block" id="nx">${sess.k===sess.steps.length-1?'Finish':'Continue'}</button>`;
  card.innerHTML=h; $('#nx').onclick=nextStep;
}

/* multiple choice */
function rMCQ(card,s,eb,st){
  const ord=shuffle(s.o.map((_,i)=>i));
  card.innerHTML=eb+`<h2 class="q">${s.q}</h2>${s.ctx?`<p class="ctx">${s.ctx}</p>`:''}<div class="opts">${ord.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="key">${'ABCDE'[k]}</span><span>${s.o[oi]}</span></button>`).join('')}</div><div class="fb-slot"></div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.oi===s.a;
    card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.oi===s.a)x.classList.add('right')});
    if(!ok) b.classList.add('wrong');
    record(st,ok); feedback(card,ok,ok?'Correct':'Not quite',s.x);
  });
}

/* match */
function rMatch(card,s,eb,st){
  const defs=shuffle(s.pairs.map((_,i)=>i));
  let sel=null, matched=0, slips=0;
  card.innerHTML=eb+`<h2 class="q">${s.q}</h2><p class="hint">Tap a term, then tap the description it belongs to.</p>
   <div class="chips">${s.pairs.map((p,i)=>`<button class="chip" data-t="${i}">${p[0]}</button>`).join('')}</div>
   <div class="defs">${defs.map(i=>`<button class="def" data-d="${i}">${s.pairs[i][1]}</button>`).join('')}</div><div class="fb-slot"></div>`;
  const chips=[...card.querySelectorAll('.chip')];
  chips.forEach(c=>c.onclick=()=>{if(c.classList.contains('done'))return;chips.forEach(x=>x.classList.remove('sel'));c.classList.add('sel');sel=+c.dataset.t});
  card.querySelectorAll('.def').forEach(d=>d.onclick=()=>{
    if(d.classList.contains('done'))return;
    if(sel===null){chips.find(c=>!c.classList.contains('done'))?.focus();return}
    if(+d.dataset.d===sel){
      d.classList.add('done'); d.innerHTML=`<small>${s.pairs[sel][0]}</small>${s.pairs[sel][1]}`;
      const c=chips[sel]; c.classList.remove('sel'); c.classList.add('done'); c.disabled=true;
      sel=null; matched++;
      if(matched===s.pairs.length){const ok=slips<=1;record(st,ok);feedback(card,ok,ok?(slips?'Matched, with one slip':'Perfect match'):`Matched after ${slips} slips`,s.x||(ok?'All pairs linked correctly.':'This one goes to your review queue so you can try it again later.'))}
    } else {slips++; d.classList.add('flash'); setTimeout(()=>d.classList.remove('flash'),550); chips.forEach(x=>x.classList.remove('sel')); sel=null}
  });
}

/* sort */
function rSort(card,s,eb,st){
  const items=shuffle(s.items.map((it,i)=>i)); const pick={};
  card.innerHTML=eb+`<h2 class="q">${s.q}</h2>${s.ctx?`<p class="ctx">${s.ctx}</p>`:''}
   <div class="sorts">${items.map(i=>`<div class="srow" data-i="${i}"><span class="stext">${s.items[i][0]}</span><div class="seg">${s.b.map((b,bi)=>`<button data-b="${bi}" aria-pressed="false">${b}</button>`).join('')}</div></div>`).join('')}</div>
   <button class="btn accent block" id="chk" disabled>Check answers</button><div class="fb-slot"></div>`;
  const chk=$('#chk');
  card.querySelectorAll('.srow').forEach(r=>r.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    if(chk.dataset.done)return;
    r.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');
    pick[r.dataset.i]=+b.dataset.b; chk.disabled=Object.keys(pick).length<s.items.length;
  }));
  chk.onclick=()=>{
    chk.dataset.done=1; chk.disabled=true; let score=0;
    card.querySelectorAll('.srow').forEach(r=>{const i=+r.dataset.i, want=s.items[i][1], got=pick[i];const ok=want===got;if(ok)score++;
      r.classList.add(ok?'right':'wrong'); r.querySelectorAll('.seg button').forEach(x=>x.disabled=true);
      if(!ok){const v=document.createElement('span');v.className='verdict';v.textContent='Belongs in: '+s.b[want];r.appendChild(v)}});
    const ok=score/s.items.length>=0.8; record(st,ok);
    feedback(card,ok,`${score} of ${s.items.length} sorted correctly`,s.x);
  };
}

/* order */
function rOrder(card,s,eb,st){
  let pool=shuffle(s.items.map((_,i)=>i)); if(pool.every((v,i)=>v===i)&&pool.length>1) pool.reverse();
  const seq=[];
  card.innerHTML=eb+`<h2 class="q">${s.q}</h2><p class="hint">Tap items to place them. Tap a placed item to send it back.</p><div class="seq" id="seq"></div><div class="pool" id="pool"></div><button class="btn accent block" id="chk" disabled>Check order</button><div class="fb-slot"></div>`;
  const draw=()=>{
    $('#seq').innerHTML=seq.map((i,k)=>`<button data-i="${i}"><span class="n">${k+1}</span>${s.items[i]}</button>`).join('');
    $('#pool').innerHTML=pool.map(i=>`<button data-i="${i}">${s.items[i]}</button>`).join('');
    $('#chk').disabled=pool.length>0;
    $('#seq').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;seq.splice(seq.indexOf(i),1);pool.push(i);draw()});
    $('#pool').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;pool=pool.filter(x=>x!==i);seq.push(i);draw()});
  };
  draw();
  $('#chk').onclick=()=>{
    const ok=seq.every((v,k)=>v===k);
    $('#seq').querySelectorAll('button').forEach((b,k)=>{b.classList.add(+b.dataset.i===k?'right':'wrong');b.onclick=null;b.disabled=true});
    $('#chk').disabled=true; record(st,ok);
    feedback(card,ok,ok?'Correct sequence':'Not quite',(ok?'':`The order is: <ol class="answer-list">${s.items.map(t=>`<li>${t}</li>`).join('')}</ol>`)+(s.x||''));
  };
}

/* finish */
function finish(){
  const k=sess.kind, ok=sess.ok, n=sess.n, pct=n?Math.round(ok/n*100):100;
  let bonus=0, nextMi=null, title;
  if(k==='module'){
    const m=MODS[sess.mi]; title=m.name;
    if(!S.done[m.code]){bonus=25;S.xp+=bonus;sess.gained+=bonus}
    const prev=S.done[m.code]; S.done[m.code]={ok,n,best:Math.max(n?Math.round(ok/n*100):100,prev&&prev.best||0),at:Date.now()}; S.cur=null;
    if(sess.mi<MODS.length-1) nextMi=sess.mi+1;
  } else title=k==='exam'?'Mastery exam':'Review session';
  const gain=sess.gained;
  S.log.unshift({t:title,kind:k,code:k==='module'?MODS[sess.mi].code:k==='exam'?'Exam':'Review',ok,n,xp:gain,at:Date.now()}); if(S.log.length>200) S.log=S.log.slice(0,200);
  markDay(); save();
  const verdict=pct>=85?'Expert standard. Well done.':pct>=65?'Solid. Revisit the expert notes on anything you missed.':'Worth another pass. Missed questions are waiting in your review queue.';
  sess=null; document.body.classList.remove('in-session'); view='result';
  renderTop(); renderTabs(); window.scrollTo(0,0);
  main.innerHTML=`<section class="card fade" style="align-items:flex-start">
    <span class="mono" style="color:var(--accent)">${k==='module'?'Module complete':k==='exam'?'Exam result':'Review complete'}</span>
    <h2>${title}</h2>
    <div class="big">${pct}%</div>
    <p class="lede">${verdict}</p>
    <div class="tiles" style="width:100%">
      <div class="tile"><b>${ok}/${n}</b><span>Correct</span></div>
      <div class="tile"><b>+${gain}</b><span>XP earned${bonus?', incl. completion bonus':''}</span></div>
      <div class="tile"><b>${Object.keys(S.done).length}/${MODS.length}</b><span>Modules done</span></div>
      <div class="tile"><b>${S.missed.length}</b><span>In review queue</span></div>
    </div>
    <div class="row-actions" style="width:100%">
      ${nextMi!==null?`<button class="btn primary" id="nm" style="flex:1 1 200px">Next · ${MODS[nextMi].code} ${MODS[nextMi].name}</button>`:''}
      ${S.missed.length?`<button class="btn" id="rv" style="flex:1 1 140px">Review ${S.missed.length} missed</button>`:''}
      <button class="btn ghost" id="bk" style="flex:1 1 120px">All modules</button>
    </div>
  </section>`;
  if(nextMi!==null) $('#nm').onclick=()=>startModule(nextMi);
  if(S.missed.length) $('#rv').onclick=startReview;
  $('#bk').onclick=()=>go('learn');
}

/* ── GLOSSARY ── */
function vGloss(){
  main.innerHTML=`<label class="mono" for="gq" style="color:var(--muted)">Search terms</label><input id="gq" class="search" type="search" placeholder="e.g. blueprint, Kano, failure demand" autocomplete="off" style="margin-top:-14px"><div id="gl"></div>`;
  const list=[...GLOSS].sort((a,b)=>a[0].localeCompare(b[0]));
  const draw=q=>{
    q=(q||'').toLowerCase().trim();
    const f=list.filter(g=>!q||g[0].toLowerCase().includes(q)||g[1].toLowerCase().includes(q));
    if(!f.length){$('#gl').innerHTML=`<div class="empty"><b>No matches</b><p>Try a shorter word, or browse the full list by clearing the search.</p></div>`;return}
    let last='',h='<div class="glist">';
    f.forEach(g=>{const L=g[0][0].toUpperCase(); if(!q&&L!==last){h+=`<div class="letter mono">${L}</div>`;last=L}
      h+=`<div class="gitem"><b>${g[0]}</b><p>${g[1]}</p><button data-m="${g[2]}">Open ${MODS[g[2]].code} · ${MODS[g[2]].name}</button></div>`});
    $('#gl').innerHTML=h+'</div>';
    $('#gl').querySelectorAll('.gitem button').forEach(b=>b.onclick=()=>startModule(+b.dataset.m));
  };
  draw(''); $('#gq').oninput=e=>draw(e.target.value);
}

/* ── PROGRESS ── */
function encode(){try{return 'SDA1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return ''}}
function decode(str){str=(str||'').trim();if(!str)throw new Error('empty');
  let json;
  if(str[0]==='{') json=str; else {str=str.replace(/^SDA1\./,'').replace(/\s+/g,'');json=decodeURIComponent(escape(atob(str)))}
  const o=JSON.parse(json); if(typeof o!=='object'||typeof o.xp!=='number'||!o.done) throw new Error('shape');
  return Object.assign(fresh(),o)}
function vMe(){
  const ans=Object.keys(S.res).length, cor=Object.values(S.res).filter(Boolean).length;
  const st=streak(), isFile=location.protocol==='file:';
  const logH=S.log.length?`<div class="log">${S.log.slice(0,12).map(e=>{const p=e.n?Math.round(e.ok/e.n*100):100;return `<div class="logrow"><span class="mono lcode">${e.code}</span><span class="lmain"><b>${e.t}</b><span class="hint">${fmtTime(e.at)} · ${e.ok}/${e.n} correct · +${e.xp} XP</span></span><span class="lpct ${p>=85?'hi':p>=65?'mid':'lo'}">${p}%</span></div>`}).join('')}</div>${S.log.length>12?`<p class="hint">Showing the latest 12 of ${S.log.length} sessions.</p>`:''}`:`<p class="hint">Finished modules, reviews and exams will be listed here with date and score.</p>`;
  main.innerHTML=`${canSave?'':`<div class="warn" role="alert"><b>Progress can't be saved in this viewer.</b> Open the file in Chrome or Safari, or copy a backup code below before you close it.</div>`}
  <div class="savebar ${canSave?'ok':'no'}"><span class="dot"></span><span>${canSave?`Progress saves automatically on this device · last saved ${fmtTime(S.saved)}`:'Automatic saving is off in this viewer'}</span></div>
  <div class="tiles">
    <div class="tile"><b>${S.xp}</b><span>XP</span></div>
    <div class="tile"><b>${Object.keys(S.done).length}/${MODS.length}</b><span>Modules done</span></div>
    <div class="tile"><b>${ans?Math.round(cor/ans*100)+'%':'–'}</b><span>Accuracy, latest attempts</span></div>
    <div class="tile"><b>${st}</b><span>Day streak · ${S.days.length} ${S.days.length===1?'day':'days'} studied</span></div></div>
  <section class="card"><h3 class="section-h">Mastery by module</h3><div class="bars">${MODS.map((m,mi)=>{const p=mastery(mi);return `<div class="bar"><span class="mono">${m.code}</span><span class="track2" title="${m.name}"><i style="width:${p}%"></i></span><span class="v">${p}%</span></div>`}).join('')}</div></section>
  <section class="card"><h3 class="section-h">Session history</h3>${logH}</section>
  <section class="card"><h3 class="section-h">Back up or move your progress</h3>
    <p class="prose">Your progress lives in this browser. Save a backup to keep it safe, or to carry it to another phone, browser or the online version.</p>
    <div class="row-actions">
      <button class="btn primary" id="cp" style="flex:1 1 160px">Copy backup code</button>
      ${isFile?`<button class="btn" id="dl" style="flex:1 1 160px">Save backup file</button>`:''}
    </div>
    <textarea id="code" class="codebox" readonly aria-label="Backup code" hidden></textarea>
    <div class="divider mono">Restore</div>
    <label for="paste" class="hint">Paste a backup code, or choose a backup file.</label>
    <textarea id="paste" class="codebox" placeholder="SDA1.eyJ4cCI6…" autocomplete="off" spellcheck="false"></textarea>
    <div class="row-actions">
      <button class="btn" id="rs" style="flex:1 1 160px">Restore from code</button>
      <label class="btn" for="rf" style="flex:1 1 160px">Restore from file<input type="file" id="rf" accept=".json,.txt,application/json,text/plain" hidden></label>
    </div>
    <p class="hint" id="rmsg" role="status"></p></section>
  <section class="card"><h3 class="section-h">Appearance</h3><p class="hint">You can also switch any time with the sun and moon button at the top.</p><div class="segctl" role="group" aria-label="Theme">${['system','light','dark'].map(t=>`<button data-t="${t}" aria-pressed="${S.theme===t}">${t==='system'?'Match device':t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></section>
  <section class="card"><h3 class="section-h">Use it as a phone app</h3>
    <ol class="steps-install"><li><b>iPhone (Safari):</b> tap Share, then Add to Home Screen.</li><li><b>Android (Chrome):</b> tap the ⋮ menu, then Add to Home screen or Install app.</li></ol>
    <p class="hint">Each browser and device keeps its own progress. Use a backup code to move it between them.</p></section>
  <section class="card"><h3 class="section-h">Reset progress</h3><p class="hint">Clears XP, scores, history and the review queue on this device. Copy a backup code first if you may want it back.</p><div id="rz"><button class="btn danger" id="r1">Reset progress</button></div></section>`;
  main.querySelectorAll('.segctl button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;save();applyTheme();vMe()});
  $('#cp').onclick=()=>{const c=encode(), box=$('#code'); box.value=c; box.hidden=false;
    const fall=()=>{box.focus();box.select();pop('Code selected, copy it')};
    try{navigator.clipboard.writeText(c).then(()=>pop('Backup code copied'),fall)}catch(e){fall()}};
  if(isFile) $('#dl').onclick=()=>{try{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='service-design-progress-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);pop('Backup saved')}catch(e){pop('Could not save file')}};
  const restore=str=>{try{const o=decode(str);o.theme=S.theme;S=o;save();applyTheme();pop('Progress restored');vMe();$('#rmsg').textContent=`Restored ${S.xp} XP and ${Object.keys(S.done).length} completed modules.`}
    catch(e){$('#rmsg').textContent='That backup could not be read. Paste the whole code, starting with SDA1., or choose a file saved from this app.'}};
  $('#rs').onclick=()=>restore($('#paste').value);
  $('#rf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(String(r.result));r.readAsText(f)};
  $('#r1').onclick=()=>{$('#rz').innerHTML=`<p style="font-weight:700;margin-bottom:10px">This cannot be undone.</p><div class="row-actions"><button class="btn danger" id="r2">Yes, reset everything</button><button class="btn" id="r3">Keep my progress</button></div>`;
    $('#r2').onclick=()=>{const th=S.theme;S=fresh();S.theme=th;save();go('me');pop('Progress reset')};
    $('#r3').onclick=vMe;};
}

render();
})();

</script>
</body>
</html>
