<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Service Design Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SD Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;600&display=swap">
<style>
/* Layout concept: a phone-first app shell. Content reads like a service blueprint:
   horizontal lanes, dashed "lines" as dividers, touchpoint dots for progress. */
:root{
  --paper:#EDF0F4; --surface:#FFFFFF; --sunk:#E3E8EF; --ink:#111B2E; --muted:#545F75; --line:#CBD3DE;
  --accent:#0A7560; --accent-ink:#FFFFFF; --accent-soft:#D6EDE6;
  --signal:#A9500C; --signal-soft:#F7E5D1;
  --good:#127A3C; --good-soft:#DCF0E3; --bad:#B42318; --bad-soft:#F8DFDB;
  --f-display:'Google Sans Flex','Google Sans','Product Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Google Sans Flex','Google Sans','Product Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Google Sans Code',ui-monospace,Menlo,Consolas,monospace;
  --nav-h:64px; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C121D; --surface:#151D2B; --sunk:#1C2636; --ink:#E5EAF2; --muted:#98A3B8; --line:#2A3548;
  --accent:#3FC3A2; --accent-ink:#04211A; --accent-soft:#12352D;
  --signal:#F0A44E; --signal-soft:#3A2913;
  --good:#4CD585; --good-soft:#123321; --bad:#F7877C; --bad-soft:#3D1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C121D; --surface:#151D2B; --sunk:#1C2636; --ink:#E5EAF2; --muted:#98A3B8; --line:#2A3548;
  --accent:#3FC3A2; --accent-ink:#04211A; --accent-soft:#12352D;
  --signal:#F0A44E; --signal-soft:#3A2913;
  --good:#4CD585; --good-soft:#123321; --bad:#F7877C; --bad-soft:#3D1A17; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
body.in-session{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:56px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;flex-shrink:0}
.top-title{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title small{display:block;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.xp{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.iconbtn svg{width:18px;height:18px}
.strip{max-width:720px;margin:0 auto;display:flex;gap:3px;padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip i{flex:1;height:4px;border-radius:2px;background:var(--sunk)}
.strip i.on{background:var(--accent)}
.strip i.now{background:var(--ink)}

/* main */
main{max-width:720px;margin:0 auto;padding-block:20px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body.in-session nav.tabs{display:none}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tab{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--signal);color:var(--surface);font-size:10px;display:grid;place-items:center;font-family:var(--f-mono)}

/* hero */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.hero h1{font-size:clamp(34px,9vw,52px);font-weight:700;line-height:1}
.hero h1 span{color:var(--accent)}
.lede{color:var(--muted);max-width:56ch}
.journey{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.journey-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.journey-head b{font-family:var(--f-display);font-size:19px}
.tps{display:flex;align-items:center;position:relative;padding:6px 0}
.tps::before{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;background:var(--line)}
.tps::after{content:"";position:absolute;left:6px;top:50%;height:2px;background:var(--accent);width:var(--fill,0%)}
.tp{position:relative;z-index:1;flex:1;display:flex;justify-content:center}
.tp:first-child{justify-content:flex-start}.tp:last-child{justify-content:flex-end}
.tp i{width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:block}
.tp.on i{background:var(--accent);border-color:var(--accent)}
.tp.next i{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.vis{display:flex;align-items:center;gap:8px;color:var(--muted)}
.vis::before,.vis::after{content:"";flex:1;border-top:1.5px dashed var(--line)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-align:center}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}

/* module list */
.track{display:flex;flex-direction:column;gap:8px}
.track-h{display:flex;align-items:center;gap:10px;color:var(--muted)}
.track-h::after{content:"";flex:1;border-top:1px solid var(--line)}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 14px;cursor:pointer}
.mrow:first-child{border-top:0}
.mrow:hover{background:var(--sunk)}
.mcode{font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--muted);width:44px;height:44px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}
.mrow.done .mcode{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mname{font-family:var(--f-display);font-weight:700;font-size:16.5px;line-height:1.2}
.mmeta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.lvl{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--ink)}
.lvl.Expert{background:var(--signal-soft);color:var(--signal)}
.lvl.Practitioner{background:var(--accent-soft);color:var(--accent)}
.pct{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.mrow.done .pct{color:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.eyebrow{display:flex;gap:10px;align-items:center;color:var(--muted);flex-wrap:wrap}
.eyebrow .kind{color:var(--accent)}
.eyebrow .kind.q{color:var(--signal)}
.card h2{font-size:24px;font-weight:700}
.card h2.q{font-size:20px;line-height:1.3}
.prose{max-width:65ch}
.prose b{font-weight:700}
.ctx{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:14.5px;color:var(--muted)}
dl.pts{margin:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
dl.pts div{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:11px 0;border-bottom:1px solid var(--line)}
@media(min-width:560px){dl.pts div{grid-template-columns:170px minmax(0,1fr);gap:14px}}
dl.pts dt{font-weight:700;font-size:14.5px}
dl.pts dd{margin:0;font-size:14.5px;color:var(--muted)}
.note{border-radius:10px;padding:14px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.note.expert{background:var(--signal-soft)}
.note.expert .mono{color:var(--signal)}
.note.field{background:var(--accent-soft)}
.note.field .mono{color:var(--accent)}
.refs{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.refs .mono{margin-bottom:2px}
figure.lanes{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
figure.lanes figcaption{padding:9px 12px;background:var(--ink);color:var(--paper)}
.lane{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.lane:first-of-type{border-top:0}
.lane b{font-weight:700}
.lane span{color:var(--muted)}
.lane-line{display:flex;align-items:center;gap:8px;padding:4px 12px;color:var(--signal);background:var(--sunk)}
.lane-line::before,.lane-line::after{content:"";flex:1;border-top:1.5px dashed var(--signal)}
.lane-line + .lane{border-top:0}

/* options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .key{font-family:var(--f-mono);font-size:12px;font-weight:600;width:24px;height:24px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;flex-shrink:0}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.fb{border-radius:12px;padding:14px;font-size:14.5px;display:flex;flex-direction:column;gap:6px;border-left:4px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb strong{font-family:var(--f-display);font-size:16px}
.fb-slot{display:flex;flex-direction:column;gap:12px}
.fb-slot:empty{display:none}

/* match */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:99px;border:1.5px solid var(--ink);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.chip.sel{background:var(--ink);color:var(--paper)}
.chip.done{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.defs{display:flex;flex-direction:column;gap:8px}
.def{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface);cursor:pointer;font-size:14.5px;line-height:1.4}
.def:hover:not(.done){border-color:var(--accent)}
.def.done{border-style:solid;border-color:var(--good);background:var(--good-soft);cursor:default}
.def.done small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--good);margin-bottom:3px}
.def.flash{border-color:var(--bad);border-style:solid;background:var(--bad-soft)}
.hint{font-size:13.5px;color:var(--muted)}

/* sort */
.sorts{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px}
.srow .stext{font-size:14.5px;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:8px 6px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.srow.right{border-color:var(--good);background:var(--good-soft)}
.srow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.srow .verdict{font-size:12.5px;font-family:var(--f-mono);letter-spacing:.04em}

/* order */
.seq{display:flex;flex-direction:column;gap:6px;min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:8px}
.seq:empty::before{content:"Tap items below in the right order";color:var(--muted);font-size:14px;padding:8px}
.seq button,.pool button{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:14.5px;font-weight:700;width:100%}
.seq button{border-color:var(--ink)}
.seq button .n{font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex-shrink:0}
.seq button.right{border-color:var(--good);background:var(--good-soft)}
.seq button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-direction:column;gap:6px}
.answer-list{margin:0;padding-left:20px;font-size:14px}

/* summary / tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12.5px;color:var(--muted)}
.big{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:44px minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:13.5px}
.bar .track2{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar .track2 i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar .v{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted)}
.section-h{font-size:20px;font-weight:700}

/* glossary & library */
.search{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.search:focus{outline:none;border-color:var(--accent)}
.glist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gitem{padding:13px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.gitem:first-child{border-top:0}
.gitem b{font-family:var(--f-display);font-size:16px}
.gitem p{font-size:14.5px;color:var(--muted)}
.gitem button{align-self:flex-start;background:none;border:0;padding:0;color:var(--accent);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:2px}
.letter{padding:6px 16px;background:var(--sunk);color:var(--muted)}
.book{padding:13px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.book:first-child{border-top:0}
.book b{font-family:var(--f-display);font-size:16px;line-height:1.25}
.book .by{font-size:13px;color:var(--ink)}
.book .by span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-left:6px}
.book p{font-size:14px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:32px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{font-family:var(--f-display);font-size:20px;color:var(--ink)}
.qlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qlist div{padding:12px 16px;border-top:1px solid var(--line);font-size:14.5px;display:flex;gap:10px}
.qlist div:first-child{border-top:0}
.qlist .mono{color:var(--muted);flex-shrink:0;padding-top:3px}
.segctl{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.segctl button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;font-size:14px}
.segctl button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.steps-install{margin:0;padding-left:20px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}

.pop{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 66px);right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-weight:600;font-size:13px;padding:8px 12px;border-radius:10px;animation:pop 1.6s ease forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

.warn{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:12px 14px;font-size:14.5px}
.warn b{color:var(--bad)}
.savebar{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.savebar .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.savebar.no .dot{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.resume{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent-soft);cursor:pointer}
.resume .mono{color:var(--accent)}
.resume b{font-family:var(--f-display);font-size:16.5px}
.log{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.logrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lcode{color:var(--muted)}
.lmain{display:flex;flex-direction:column;min-width:0}
.lmain b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpct{font-family:var(--f-mono);font-weight:600;font-size:13px;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.lpct.hi{background:var(--good-soft);color:var(--good)}.lpct.mid{background:var(--signal-soft);color:var(--signal)}.lpct.lo{background:var(--bad-soft);color:var(--bad)}
.codebox{width:100%;min-height:76px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);font-family:var(--f-mono);font-size:12px;line-height:1.4;resize:vertical;word-break:break-all}
