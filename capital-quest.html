<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Capital Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a single app shell — header bar, then one view at a time (home, play, results, atlas, friends) in a 1120px column; the pixel globe is the recurring anchor. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F3F6; --ink:#14161C; --muted:#5D6270; --line:#E2E4EA;
  --brand:#3146E6; --brand-2:#2335C4; --brand-ink:#FFFFFF; --sun:#FFB21A; --sun-ink:#3A2600;
  --good:#0F9D66; --good-bg:#DDF5EA; --bad:#DB3F46; --bad-bg:#FBE3E4;
  --ocean:#3C66DA; --ocean-2:#2B4CB5; --land:#8ED36B; --land-2:#5DAE47; --hl:#FFB21A; --pin:#E53950; --atmo:rgba(80,130,255,.25);
  --shadow:0 1px 0 rgba(20,22,28,.04),0 6px 18px -10px rgba(20,22,28,.18);
  --f-display:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F13; --surface:#17191F; --surface-2:#22252D; --ink:#F2F3F6; --muted:#A3A8B4; --line:#2E323C;
  --brand:#7B88FF; --brand-2:#5562E0; --brand-ink:#0E0F13; --sun:#FFC64A; --sun-ink:#2A1C00;
  --good:#2DD394; --good-bg:#0F3328; --bad:#FF6A70; --bad-bg:#3A1720;
  --ocean:#1C3482; --ocean-2:#13245E; --land:#4FAE4C; --land-2:#2F7D37; --hl:#FFC64A; --pin:#FF5470; --atmo:rgba(110,124,255,.28);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F13; --surface:#17191F; --surface-2:#22252D; --ink:#F2F3F6; --muted:#A3A8B4; --line:#2E323C;
  --brand:#7B88FF; --brand-2:#5562E0; --brand-ink:#0E0F13; --sun:#FFC64A; --sun-ink:#2A1C00;
  --good:#2DD394; --good-bg:#0F3328; --bad:#FF6A70; --bad-bg:#3A1720;
  --ocean:#1C3482; --ocean-2:#13245E; --land:#4FAE4C; --land-2:#2F7D37; --hl:#FFC64A; --pin:#FF5470; --atmo:rgba(110,124,255,.28);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;color:var(--brand);background:none;border:0;padding:0;letter-spacing:.01em;text-shadow:2px 2px 0 var(--sun)}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav button{background:none;border:0;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.nav button:not(.icon-btn) svg{width:18px;height:18px}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0}
.icon-btn svg{width:20px;height:20px}
@media (max-width:640px){.nav .txt{display:none}.nav button:not(.icon-btn){padding:10px}.logo{font-size:20px}.nav{gap:2px}}
@media (max-width:360px){.logo{font-size:17px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px;background:var(--surface-2);color:var(--ink);transition:transform .08s ease,filter .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 3px 0 var(--brand-2)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.big{padding:16px 24px;font-size:18px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding-block:28px 8px}
.hero-title{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,8vw,84px);line-height:.95;color:var(--brand);text-shadow:4px 4px 0 var(--sun);letter-spacing:.01em}
.hero-sub{font-size:19px;color:var(--muted);max-width:30ch;margin-top:14px}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.stats{display:flex;flex-wrap:wrap;gap:20px;margin-top:24px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.globe-box{position:relative;aspect-ratio:1;max-width:440px;width:100%;margin-inline:auto}
.globe-box canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.globe-box canvas:active{cursor:grabbing}
.globe-hint{position:absolute;left:0;right:0;bottom:-4px;text-align:center;font-size:12px;color:var(--muted)}
@media (max-width:820px){.hero{grid-template-columns:1fr}.globe-box{max-width:320px;grid-row:1}}

.section{padding-block:28px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.section-head h2{font-size:24px;font-weight:800}

.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lvl{position:relative;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;min-height:132px;box-shadow:var(--shadow)}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;color:var(--brand)}
.lvl .t{font-weight:700;font-size:15px}
.lvl .s{font-size:13px;color:var(--muted)}
.lvl .stars{margin-top:auto;display:flex;gap:3px}
.lvl.locked{background:var(--surface-2);box-shadow:none}
.lvl.locked .n{color:var(--muted)}
.lvl.current{outline:3px solid var(--sun);outline-offset:-1px}
.lock{position:absolute;top:12px;right:12px;color:var(--muted)}
.star{width:18px;height:18px}
.star.on path{fill:var(--sun)} .star.off path{fill:var(--line)}
.diff{display:flex;gap:2px;margin-top:2px}
.diff i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.diff i.on{background:var(--brand)}

.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;padding:16px;display:flex;flex-direction:column;gap:6px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.mode .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand)}
.mode .ic svg{width:22px;height:22px}
.mode b{font-size:16px}
.mode span{font-size:14px;color:var(--muted)}
.mode .tag{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--good-bg);color:var(--good)}

/* play */
.play{padding-block:16px 40px}
.play-bar{display:flex;align-items:center;gap:14px}
.progress{flex:1;height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s ease}
.hearts{display:flex;gap:3px}
.hearts svg{width:20px;height:20px}
.hearts .on path{fill:var(--pin)} .hearts .off path{fill:var(--line)}
.score{font-weight:800;font-size:18px;min-width:70px;text-align:right}
.play-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;margin-top:18px;align-items:start}
@media (max-width:820px){.play-grid{grid-template-columns:1fr}.play .globe-box{max-width:260px}}
.globe-card{padding:16px}
.globe-cap{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:8px}
.q-card{padding:22px}
.q-eyebrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.q-prompt{font-size:clamp(24px,3.4vw,32px);font-weight:800;line-height:1.2;margin:10px 0 18px}
.q-prompt .flag{font-size:1.1em;margin-right:6px}
.q-prompt em{font-style:normal;color:var(--brand)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;min-height:58px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;background:var(--surface-2);color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.type-row{display:flex;gap:10px}
.type-row input{flex:1;min-width:0;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:18px;font-weight:600}
.type-row input:focus{border-color:var(--brand);outline:none}
.type-tools{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.linkish{background:none;border:0;padding:4px 0;color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.timer{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;background:var(--sun);width:100%}
.feedback{margin-top:18px;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:10px;animation:rise .25s ease}
.feedback .verdict{font-weight:800;font-size:18px}
.feedback .verdict.ok{color:var(--good)} .feedback .verdict.no{color:var(--bad)}
.feedback ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.fb-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.pop{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 80px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:800;z-index:60;animation:pop 1.1s ease forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* results */
.results{padding-block:32px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.results{grid-template-columns:1fr}}
.res-title{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,6vw,64px);line-height:1;color:var(--brand);text-shadow:3px 3px 0 var(--sun)}
.big-stars{display:flex;gap:8px;margin:18px 0}
.big-stars .star{width:52px;height:52px}
.big-stars .star.on{animation:starIn .45s cubic-bezier(.3,1.6,.5,1) both}
.big-stars .star:nth-child(2){animation-delay:.15s}.big-stars .star:nth-child(3){animation-delay:.3s}
@keyframes starIn{from{transform:scale(.2) rotate(-30deg)}to{transform:none}}
.res-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0 22px}
.res-stats .card{padding:14px}
.res-stats b{display:block;font-size:24px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.chip.bad{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* modal / country sheet */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,30,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:960px;background:var(--bg);border-radius:20px;border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden;animation:rise .25s ease}
.sheet-head{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head .flag{font-size:40px;line-height:1}
.sheet-head h2{font-size:26px;font-weight:800}
.sheet-head .x{margin-left:auto}
.sheet-body{padding:20px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px}
@media (max-width:760px){.sheet-body{grid-template-columns:1fr}.sheet .globe-box{max-width:260px}}
.capital-big{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.05;color:var(--brand);margin:4px 0 2px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.facts b{display:block;font-size:15px;overflow-wrap:anywhere}
.insights{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.insight{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.insight .dot{flex:none;width:26px;height:26px;border-radius:8px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.gallery-wrap{grid-column:1/-1}
.gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;border-radius:12px;padding:6px;border:1px solid var(--line);background:var(--surface);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile canvas{width:100%;aspect-ratio:16/10;max-width:100%;image-rendering:pixelated;border-radius:8px;display:block;background:var(--surface-2)}
.tile b{font-size:13px;line-height:1.25;padding-inline:2px}
.tile span{font-size:12px;color:var(--muted);padding:0 2px 2px}
.mastery{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.mastery.m{background:var(--good-bg);color:var(--good)}

/* atlas */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input{flex:1 1 220px;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.arow{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.arow .flag{font-size:28px;line-height:1;flex:none}
.arow div{min-width:0}
.arow b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow span{font-size:13px;color:var(--muted)}
.arow .md{margin-left:auto;flex:none;width:10px;height:10px;border-radius:3px;background:var(--line)}
.arow .md.p{background:var(--sun)} .arow .md.m{background:var(--good)}
.blur{filter:blur(5px);user-select:none}

/* leaderboard */
.lb{width:100%;border-collapse:collapse}
.lb th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 12px;font-weight:700;white-space:nowrap}
.lb th:nth-child(2){text-align:left}
.lb td{padding:12px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lb td:nth-child(2){text-align:left;white-space:normal}
.lb tr.me td{background:color-mix(in srgb,var(--sun) 16%,transparent)}
.rank{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);width:44px}
.rank.r1{color:var(--sun)}
.who b{font-weight:800}.who small{display:block;color:var(--muted);font-size:12px}
.tbl-wrap{overflow-x:auto}
.lb-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.lb-grid{grid-template-columns:1fr}}
.code-box{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--surface-2);padding:10px;border-radius:10px;max-height:90px;overflow:auto;user-select:all}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

/* onboarding */
.ob{max-width:560px}
.ob .sheet-body{grid-template-columns:1fr;text-align:center;justify-items:center;padding:28px 24px 8px}
.ob-art{width:180px;height:180px}
.ob h2{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;color:var(--brand);font-weight:700}
.ob p{color:var(--muted);max-width:42ch;font-size:16px}
.ob-foot{display:flex;align-items:center;gap:10px;padding:16px 24px 22px}
.dots{display:flex;gap:6px;margin-right:auto}
.dots i{width:8px;height:8px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--brand);width:22px}
.ob input{width:100%;max-width:320px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:17px;text-align:center;font-weight:600}
.ob input:focus{border-color:var(--brand);outline:none}
.ob-list{display:grid;gap:8px;text-align:left;width:100%;max-width:400px}
.ob-list div{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.ob-list svg{flex:none;width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:70;animation:rise .2s ease;max-width:calc(100% - 32px)}

  progRef(){return this.db&&this.uid?this.db.doc("data/users/"+this.uid+"/progress"):null},

  async syncNow(){const r=this.progRef();if(!r||!this.synced)return;const body=progressOf();const k=JSON.stringify(body);if(k===this.syncLast)return;if(this.syncBusy){this.queueSync();return}this.syncBusy=true;
    try{await r.set({...body,saved:new Date().toISOString()});this.syncLast=k}catch(e){if(e&&e.code==="invalid_argument")this.synced=false}finally{this.syncBusy=false}},

      <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px"><h3 style="font-size:18px;font-weight:800">Your name</h3>
        <form class="type-row" id="nameForm"><input id="nameIn" value="${esc(S.name)}" maxlength="24" placeholder="Your name" aria-label="Your name"><button class="btn primary">Save</button></form></div>
      <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px"><h3 style="font-size:18px;font-weight:800">Your friend code</h3>
        <p class="note">Send this to a friend. When they paste it below on their copy, your scores appear on their board. Send a fresh one after you play.</p>
        <div class="code-box" id="codeBox">${myCode()}</div><button class="btn" id="copyCode">Copy code</button></div>
      <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px"><h3 style="font-size:18px;font-weight:800">Add a friend's code</h3>
        <form class="type-row" id="addForm"><input id="addIn" placeholder="CQ-…" aria-label="Friend code"><button class="btn primary">Add</button></form>
        ${S.friends.length?`<div class="chips">${S.friends.map(f=>`<button class="chip" data-rm="${esc(f.p)}" title="Remove">${esc(f.n)} ✕</button>`).join("")}</div>`:""}</div>
      <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px"><h3 style="font-size:18px;font-weight:800">Back up your progress</h3>
        <p class="note">${saveNote()} To move progress to another phone or browser, copy this backup code and paste it there.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="copyBackup">Copy backup code</button></div>
        <form class="type-row" id="restoreForm"><input id="restoreIn" placeholder="Paste a CQS-… backup code" aria-label="Backup code"><button class="btn primary">Restore</button></form></div>
      <p class="note" id="netNote"></p></div></div></div>`;
  const draw=()=>{const box=$("#lbBox");if(!box)return;const rows=board().sort((a,b)=>lbSort==="daily"?((b.daily??-1)-(a.daily??-1)):(b[lbSort]-a[lbSort])||(b.xp-a.xp));box.innerHTML=boardTable(rows,lbSort,false);
    const n=$("#netNote");if(n)n.textContent=!Net.db?"Live sharing isn't available in this view, so friend codes are the way to compare scores here.":Net.canWrite===false?"You can see everyone who plays here, but this view can't save your score to the shared board. Use your friend code instead.":(S.name?"Your score saves to this page's board each time you finish a run.":"Add your name so your score can join this page's board.")};
  draw();Net.listeners.clear();Net.listeners.add(draw);
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{lbSort=b.dataset.s;app.querySelectorAll("[data-s]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));draw()});
  $("#nameForm").onsubmit=e=>{e.preventDefault();const v=$("#nameIn").value.trim().slice(0,24);if(!v){toast("Enter a name first");return}S.name=v;save();Net.push();$("#codeBox").textContent=myCode();draw();toast("Saved. Friends will see you as "+v)};
  $("#copyCode").onclick=()=>{const t=myCode();const sel=()=>{const r=document.createRange();r.selectNodeContents($("#codeBox"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Code selected. Copy it with your keyboard or menu.")};try{navigator.clipboard.writeText(t).then(()=>toast("Copied. Paste it to a friend."),sel)}catch(e){sel()}};
  $("#addForm").onsubmit=e=>{e.preventDefault();const o=readCode($("#addIn").value);if(!o){toast("That doesn't look like a Capital Quest code. It should start with CQ-.");return}if(o.p===S.pid){toast("That's your own code.");return}S.friends=S.friends.filter(f=>f.p!==o.p);S.friends.push(o);save();toast(o.n+" added to your board");renderFriends()};
  $("#copyBackup").onclick=()=>{const t=backupCode();try{navigator.clipboard.writeText(t).then(()=>toast("Backup code copied. Keep it somewhere safe."),()=>{$("#restoreIn").value=t;$("#restoreIn").select();toast("Code is in the box. Copy it from there.")})}catch(e){$("#restoreIn").value=t;$("#restoreIn").select()}};
  $("#restoreForm").onsubmit=e=>{e.preventDefault();const o=readBackup($("#restoreIn").value);if(!o){toast("That isn't a backup code. It should start with CQS-.");return}mergeProgress(S,o);save();Net.push();toast("Progress restored");renderFriends()};
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.friends=S.friends.filter(f=>f.p!==b.dataset.rm);save();renderFriends()})}

// ---------- onboarding ----------
function onboarding(){let step=0;const md=document.createElement("div");md.className="modal";md.setAttribute("role","dialog");md.setAttribute("aria-modal","true");md.setAttribute("aria-label","How Capital Quest works");
  const steps=[
    ()=>`<canvas class="ob-art" id="obGlobe"></canvas><h2>Welcome to Capital Quest</h2><p>Learn the capital of all 197 countries. It takes about five minutes a level, and you'll pick up the map along the way.</p><input id="obName" maxlength="24" placeholder="What should friends call you?" aria-label="Your name" value="${esc(S.name)}">`,
    ()=>`<div class="ob-list" style="margin-top:6px">${[1,4,7,9].map(n=>`<div><b style="font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--brand);width:26px">${n}</b><span><b>${LEVELS[n-1].t}.</b> ${LEVELS[n-1].s}.</span></div>`).join("")}</div><h2>Climb ten levels</h2><p>Each level has about 20 countries and 5 hearts. A wrong answer costs a heart. Finish with any hearts left to unlock the next level. No mistakes earns 3 stars.</p>`,
    ()=>`<canvas class="ob-art" id="obGlobe"></canvas><h2>See where it is</h2><p>The pixel globe flies to every country you're asked about. After you answer, it pins the capital and shows two facts. Tap <b>Explore</b> for terrain postcards and more.</p>`,
    ()=>`<div class="ob-list" style="margin-top:6px"><div>${ICON.cal.replace("<svg","<svg style='color:var(--brand)'")}<span><b>Daily Challenge.</b> Same 10 capitals for everyone today.</span></div><div>${ICON.users.replace("<svg","<svg style='color:var(--brand)'")}<span><b>Friends board.</b> Share this page or swap friend codes.</span></div><div>${ICON.redo.replace("<svg","<svg style='color:var(--brand)'")}<span><b>Review.</b> Missed capitals come back until you get them.</span></div></div><h2>Play with friends</h2><p>Your XP, stars and mastered capitals go on the leaderboard. Keys 1–4 pick answers and Enter moves on.</p>`
  ];
  const draw=()=>{md.innerHTML=`<div class="sheet ob"><div class="sheet-body">${steps[step]()}</div><div class="ob-foot"><div class="dots">${steps.map((_,i)=>`<i class="${i===step?"on":""}"></i>`).join("")}</div>${step>0?`<button class="btn ghost" id="obBack">Back</button>`:`<button class="btn ghost" id="obSkip">Skip</button>`}<button class="btn primary" id="obNext">${step===steps.length-1?"Start playing":"Next"}</button></div></div>`;
    const gc=md.querySelector("#obGlobe");if(gc){const g=Globe.create(gc,{spin:step===0,lon:step===2?0:80,lat:20});if(step===2)setTimeout(()=>g.focus("KEN",{pin:true,zoom:1.3}),300)}
    const nm=md.querySelector("#obName");if(nm)nm.oninput=()=>{S.name=nm.value.trim().slice(0,24)};
    const nb=md.querySelector("#obNext");nb.onclick=()=>{if(step<steps.length-1){step++;draw()}else done()};nb.focus({preventScroll:true});
    const bk=md.querySelector("#obBack");if(bk)bk.onclick=()=>{step--;draw()};const sk=md.querySelector("#obSkip");if(sk)sk.onclick=done};
  const done=()=>{S.onboarded=true;save();Net.push();md.remove();document.body.style.overflow="";if(view==="home")renderHome()};
  document.body.appendChild(md);document.body.style.overflow="hidden";draw()}
$("#helpBtn").onclick=onboarding;

// ---------- boot ----------
applyTheme();go("home");if(!S.onboarded)onboarding();Net.init();
})();
</script>

</body></html>
